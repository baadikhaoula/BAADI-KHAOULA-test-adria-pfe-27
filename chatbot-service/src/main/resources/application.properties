server.port=8083
spring.application.name=chatbot-service

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.config.import=optional:configserver:http://localhost:8888

#  Groq (OpenAI compatible)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

#  MCP Clients pour se connecter aux microservices
spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8081/mcp
spring.ai.mcp.client.streamable-http.connections.account.name=account-service
spring.ai.mcp.client.streamable-http.connections.transaction.url=http://localhost:8082/mcp
spring.ai.mcp.client.streamable-http.connections.transaction.name=transaction-service

#  Telegram Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=VotreBotUsername

# Actuator
management.endpoints.web.exposure.include=*